<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Portal Redirect &bull; Welcome East Gwillimbury</title>
    <link rel="stylesheet" href="assets/styles.css?v=67.2">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/config.js?v=65.6"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 80vh; text-align: center;">
    <div class="card" style="max-width: 440px; padding: 32px;">
        <span class="badge-pill">&#128260; Redirecting</span>
        <h2 style="margin: 12px 0;">Welcome East Gwillimbury Portal</h2>
        <p style="color: var(--muted); font-size: 14px;">Directing you to the appropriate workspace...</p>
        <div style="margin-top: 20px; font-size: 13px;">
            <a href="login.html" id="manual-link" style="color: var(--primary); font-weight: 700;">Click here if you are not redirected automatically &rarr;</a>
        </div>
    </div>

    <script>
        async function routePortal() {
            const urlParams = new URLSearchParams(window.location.search);
            const tab = urlParams.get("tab");

            // Explicit admin query param
            if (tab === "admin") {
                window.location.replace("admin-approvals.html");
                return;
            }

            const client = window.GeorginaStore.getClient();
            if (client) {
                const { data } = await client.auth.getSession();
                if (data && data.session && data.session.user) {
                    const user = data.session.user;
                    const { data: prof } = await client.from("user_profiles").select("role").eq("id", user.id).maybeSingle();
                    if (prof && prof.role === "admin") {
                        window.location.replace("admin-approvals.html");
                        return;
                    }
                    window.location.replace("dashboard.html");
                    return;
                }
            }

            // Not signed in
            window.location.replace("login.html");
        }

        routePortal();
    </script>
</body>
</html>
